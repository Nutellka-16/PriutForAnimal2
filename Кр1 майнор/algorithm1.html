    <h1 align="center" style="color: #003366;">Решение задачи №1017</h1>

    <div class="task-box">
        <p><b>Условие:</b> Дано число A. Вычислить x = a*a*a*a, при a < 10; x = a при a > 61, в противном случае x = a - sin(a*a).</p>

        <p>Введите число A:</p>
        <input type="text" id="chisloA">
        <br><br>
        <button onclick="reshat()" class="btn">Вычислить</button>
        <br><br>
        <h3 id="otvet" style="color: #004080; background: #e6f2ff; padding: 10px; border-radius: 5px;">Ответ появится здесь</h3>
    </div>

    <script>
        function reshat() {
            var a = document.getElementById('chisloA').value;
            a = parseFloat(a);
            var x;

            if (isNaN(a)) {
                document.getElementById('otvet').innerHTML = "Ошибка! Введите число.";
                return;
            }

            if (a < 10) {
                x = a * a * a * a;
            } else if (a > 61) {
                x = a;
            } else {
                x = a - Math.sin(a * a);
            }

            document.getElementById('otvet').innerHTML = "Результат x = " + x;
        }
    </script>
